<!-- ============================================================
     AIF-C01 模擬試験（65問／90分）

     ★ITパスポート版と同じく、固定の問題セットを持たない設計。
       収録済みの全バンクから、ドメイン配分（20/24/28/14/14）に沿って
       毎回65問を組み立てる。

     ★本番は択一式だけでなく複数選択式・順序問題・マッチング問題も
       出題される（CLAUDE.md 14-2節）。この模試も4形式を混ぜて出題し、
       複数選択・順序・マッチングは「全部合っていないと得点にならない」
       という公式の採点規則どおりに判定する。

     ★スコアは100〜1000、合格ラインは700（公式試験ガイド）。
       ただし本番の採点は補正スコアリングで計算式が非公開のため、
       ここでは正答率を線形に換算した目安を表示している。

     デザインは本試験画面の再現のため白基調（CLAUDE.md 4-5節の方針）。

<script>
/* ============================================================
   公式試験ガイドの値（CLAUDE.md 14-1節）
     65問（採点対象50＋採点対象外15）／90分
     スコア100〜1000、合格は700。ドメイン比率 20/24/28/14/14
   ============================================================ */
const TOTAL_Q   = 65;
const LIMIT_MIN = 90;
const PASS_SCORE = 700;

/* 形式ごとの出題数。本番の内訳は公開されていないため、
   択一式を主体に、複数選択・順序・マッチングを混ぜる構成にしている。 */
const TYPE_QUOTA = { ms:12, ord:4, mt:4 };   // 残り45問が択一式

const DOMAINS = [
  {id:'d1', name:'AI・MLの基礎',            cats:['ai_basic','ml_flow'],                n:13},
  {id:'d2', name:'生成AIの基礎',            cats:['genai','prompt'],                    n:16},
  {id:'d3', name:'基盤モデルの応用',        cats:['bedrock','sagemaker','aiservices'],  n:18},
  {id:'d4', name:'責任あるAI',              cats:['responsible'],                       n:9},
  {id:'d5', name:'セキュリティ・ガバナンス',cats:['secgov'],                            n:9},
];
const domOf  = catId => (DOMAINS.find(d => d.cats.includes(catId)) || {}).id;
const domName = did => (DOMAINS.find(d => d.id === did) || {}).name || did;

const TYPE_LABEL = { mc:'択一式', ms:'複数選択式', ord:'順序問題', mt:'マッチング問題' };

const HIST_KEY  = 'aifMockHistoryV1';
const WRONG_KEY = 'aifMockWrongV1';

const S = { view:'home', qs:[], i:0, ans:{}, flags:{}, endAt:0, timerInt:null, result:null, reviewIdx:0, mtLeft:null };

const el  = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad = n => String(n).padStart(2,'0');
const fmt = ms => { const s = Math.max(0, Math.floor(ms/1000)); return pad(Math.floor(s/60)) + ':' + pad(s%60); };
function shuffle(a){ const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r; }

/* ---------- 問題の組み立て ----------
   ドメインごとに必要数を確保しつつ、特殊形式（複数選択・順序・マッチング）を
   ドメイン比で割り当て、残りを択一式で埋める。 */
function typedPool(){
  return [
    ...QQ.map(q => ({q, type:'mc'})),
    ...SCENARIO_Q.map(q => ({q, type:'mc'})),
    ...MULTI_Q.map(q => ({q, type:'ms'})),
    ...ORDER_Q.map(q => ({q, type:'ord'})),
    ...MATCH_Q.map(q => ({q, type:'mt'})),
  ];
}
function buildExam(){
  const pool = typedPool();
  const used = new Set();
  const picked = [];
  const take = (arr, k) => { arr.slice(0, k).forEach(x => { picked.push(x); used.add(x.q.id); }); return Math.min(k, arr.length); };

  DOMAINS.forEach(d => {
    let need = d.n;
    ['ms','ord','mt'].forEach(t => {
      const want = Math.round(TYPE_QUOTA[t] * d.n / TOTAL_Q);
      if(want <= 0 || need <= 0) return;
      const cand = shuffle(pool.filter(x => x.type === t && d.cats.includes(x.q.c) && !used.has(x.q.id)));
      need -= take(cand, Math.min(want, need));
    });
    const mc = shuffle(pool.filter(x => x.type === 'mc' && d.cats.includes(x.q.c) && !used.has(x.q.id)));
    need -= take(mc, need);
  });
  // 不足があれば形式・ドメインを問わず補う
  if(picked.length < TOTAL_Q){
    take(shuffle(pool.filter(x => !used.has(x.q.id))), TOTAL_Q - picked.length);
  }
  // 出題順をシャッフルし、選択肢の表示順も設問ごとに固定して持たせる
  // （CLAUDE.md 4-8b節：判定は常に元データのindex基準）
  return shuffle(picked).slice(0, TOTAL_Q).map(x => {
    const it = { ref:x.q, type:x.type };
    if(x.type === 'mc' || x.type === 'ms') it.order = shuffle(x.q.o.map((_,i)=>i));
    if(x.type === 'ord') it.order = shuffle(x.q.o.map((_,i)=>i));
    if(x.type === 'mt'){ it.lOrder = shuffle(x.q.l.map((_,i)=>i)); it.rOrder = shuffle(x.q.r.map((_,i)=>i)); }
    return it;
  });
}

/* ---------- タイマー ---------- */
const remain = () => S.endAt - Date.now();
function startTimer(){ stopTimer(); el('timer').style.display='inline-block'; tick(); S.timerInt = setInterval(tick, 500); }
function stopTimer(){ if(S.timerInt){ clearInterval(S.timerInt); S.timerInt = null; } }
function tick(){
  const t = el('timer'); if(!t) return;
  t.textContent = '残り ' + fmt(remain());
  t.classList.toggle('low', remain() <= 10*60*1000);
  if(remain() <= 0){ stopTimer(); finish(true); }
}

/* ---------- 保存 ---------- */
const loadHist  = () => CloudStore.get(HIST_KEY) || [];
const saveHist  = h => CloudStore.set(HIST_KEY, h);
const loadWrong = () => CloudStore.get(WRONG_KEY) || {};
const saveWrong = w => CloudStore.set(WRONG_KEY, w);

/* ---------- 正誤判定 ----------
   複数選択・順序・マッチングは「全部合っていないと得点にならない」（公式規則）。
   判定はすべて元データのインデックス基準で行い、表示順には依存しない。 */
function isCorrect(item, a){
  const q = item.ref;
  if(a === undefined || a === null) return false;
  if(item.type === 'mc')  return a === q.a;
  if(item.type === 'ms'){
    const mine = [...a].sort((x,y)=>x-y), ok = [...q.a].sort((x,y)=>x-y);
    return JSON.stringify(mine) === JSON.stringify(ok);
  }
  if(item.type === 'ord') return a.length === q.a.length && a.every((v,i)=>v === q.a[i]);
  if(item.type === 'mt')  return q.l.every((_,i)=>a[i] === q.a[i]);
  return false;
}
function isAnswered(item, a){
  if(a === undefined || a === null) return false;
  if(item.type === 'mc')  return true;
  if(item.type === 'ms')  return a.length > 0;
  if(item.type === 'ord') return a.length === item.ref.o.length;
  if(item.type === 'mt')  return Object.keys(a).length === item.ref.l.length;
  return false;
}

/* ---------- 採点 ---------- */
function grade(){
  const per = {}; DOMAINS.forEach(d => { per[d.id] = {correct:0, total:0}; });
  let correct = 0, answered = 0;
  const wrongIds = [];
  S.qs.forEach((item, idx) => {
    const did = domOf(item.ref.c);
    if(per[did]) per[did].total++;
    if(isAnswered(item, S.ans[idx])) answered++;
    if(isCorrect(item, S.ans[idx])){ correct++; if(per[did]) per[did].correct++; }
    else wrongIds.push(item.ref.id);
  });
  // 本番は補正スコアリングで計算式が非公開のため、正答率を100〜1000に線形換算した目安
  const scaled = Math.round(100 + (correct / S.qs.length) * 900);
  const domains = DOMAINS.map(d => ({
    id:d.id, name:d.name, correct:per[d.id].correct, total:per[d.id].total,
    pct: per[d.id].total ? Math.round(per[d.id].correct / per[d.id].total * 100) : 0
  }));
  return { correct, answered, count:S.qs.length, scaled, domains,
           pass: scaled >= PASS_SCORE, wrongIds, at:new Date().toISOString() };
}

/* ---------- 画面 ---------- */
function render(){
  if(S.view==='home')   return renderHome();
  if(S.view==='exam')   return renderExam();
  if(S.view==='result') return renderResult();
  if(S.view==='review') return renderReview();
}

function renderHome(){
  stopTimer(); el('timer').style.display='none';
  const hist = loadHist();
  const wrongCount = Object.keys(loadWrong()).length;
  const pool = typedPool();
  const cnt = t => pool.filter(x => x.type === t).length;

  const histHtml = hist.length ? `
    <table class="hist">
      <tr><th>受験日</th><th>スコア</th><th>正答</th>${DOMAINS.map(d=>`<th>${d.name.slice(0,5)}</th>`).join('')}<th>判定</th></tr>
      ${hist.slice(0,10).map(h=>`<tr>
        <td>${new Date(h.at).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
        <td><strong>${h.scaled}</strong></td>
        <td>${h.correct}/${h.count}</td>
        ${h.domains.map(d=>`<td>${d.pct}%</td>`).join('')}
        <td style="color:${h.pass?'var(--ok)':'var(--ng)'};font-weight:700">${h.pass?'合格':'不合格'}</td>
      </tr>`).join('')}
    </table>` : `<p class="note">まだ受験履歴がありません。</p>`;

  el('app').innerHTML = `
    <div class="card">
      <h1>🤖 AIF-C01 模擬試験</h1>
      <p class="sub">本番と同じ形式で通しの演習ができます。</p>
      <table class="spec">
        <tr><th>出題数</th><td>${TOTAL_Q}問</td></tr>
        <tr><th>試験時間</th><td>${LIMIT_MIN}分</td></tr>
        <tr><th>出題形式</th><td>択一式・複数選択式・順序問題・マッチング問題の4形式<br>
          <span class="note">複数選択・順序・マッチングは全部合って初めて得点になります</span></td></tr>
        <tr><th>ドメイン配分</th><td>${DOMAINS.map(d=>d.name+' '+d.n+'問').join(' ／ ')}</td></tr>
        <tr><th>合格基準</th><td>スコア <strong>${PASS_SCORE}</strong> 以上（100〜1000）<br>
          <span class="note">ドメイン別の合格ラインはなく、総合点のみで判定されます</span></td></tr>
      </table>
      <p class="note">
        問題は収録済みの
        <strong>択一${cnt('mc')}問／複数選択${cnt('ms')}問／順序${cnt('ord')}問／マッチング${cnt('mt')}問</strong>
        から、ドメイン配分に沿って毎回選び出します。受験のたびに組み合わせが変わります。<br>
        本番の採点は補正スコアリングで計算式が公開されていないため、
        ここでは<strong>正答率を100〜1000に換算した目安</strong>を表示しています。
      </p>
      <div class="nav">
        <button class="btn btn-main" onclick="start()">▶ 試験を開始する</button>
        ${wrongCount ? `<button class="btn btn-sub" onclick="startWrong()">🔥 間違えた${wrongCount}問だけ解く</button>` : ''}
      </div>
    </div>
    <div class="card">
      <h2>受験履歴</h2>
      ${histHtml}
      ${hist.length ? `<div class="nav"><button class="btn btn-sub" onclick="clearHist()">履歴を消去</button></div>` : ''}
    </div>`;
}

function start(){
  S.qs = buildExam(); S.i = 0; S.ans = {}; S.flags = {}; S.mtLeft = null;
  S.endAt = Date.now() + LIMIT_MIN*60*1000;
  S.view = 'exam'; startTimer(); render();
}
function startWrong(){
  const ids = new Set(Object.keys(loadWrong()));
  const sel = typedPool().filter(x => ids.has(x.q.id));
  if(!sel.length){ alert('復習する問題はありません。'); return; }
  S.qs = shuffle(sel).map(x => {
    const it = { ref:x.q, type:x.type };
    if(x.type !== 'mt') it.order = shuffle(x.q.o.map((_,i)=>i));
    else { it.lOrder = shuffle(x.q.l.map((_,i)=>i)); it.rOrder = shuffle(x.q.r.map((_,i)=>i)); }
    return it;
  });
  S.i = 0; S.ans = {}; S.flags = {}; S.mtLeft = null;
  S.endAt = Date.now() + Math.max(10, Math.round(S.qs.length*1.5))*60*1000;
  S.view = 'exam'; startTimer(); render();
}

function optionsHtml(item, idx, disabled){
  const q = item.ref, marks = ['A','B','C','D','E','F'];
  if(item.type === 'mc'){
    const sel = S.ans[idx];
    return item.order.map((orig,pos)=>`
      <button class="opt${sel===orig?' sel':''}" ${disabled?'disabled':''} onclick="pickMc(${orig})">
        <span class="mk">${marks[pos]}</span><span>${esc(q.o[orig])}</span></button>`).join('');
  }
  if(item.type === 'ms'){
    const sel = S.ans[idx] || [];
    return item.order.map((orig,pos)=>`
      <button class="opt${sel.includes(orig)?' sel':''}" ${disabled?'disabled':''} onclick="pickMs(${orig})">
        <span class="mk">${sel.includes(orig)?'✓':marks[pos]}</span><span>${esc(q.o[orig])}</span></button>`).join('');
  }
  if(item.type === 'ord'){
    const picks = S.ans[idx] || [];
    return item.order.map(orig=>{
      const n = picks.indexOf(orig);
      return `<button class="opt${n>=0?' sel':''}" ${disabled?'disabled':''} onclick="pickOrd(${orig})">
        <span class="mk">${n>=0?(n+1):'–'}</span><span>${esc(q.o[orig])}</span></button>`;
    }).join('');
  }
  if(item.type === 'mt'){
    const pairs = S.ans[idx] || {};
    const order = Object.keys(pairs).map(Number);
    const leftHtml = item.lOrder.map(i=>{
      const paired = pairs[i] !== undefined;
      return `<button class="mtitem${paired?' paired':''}${S.mtLeft===i?' active':''}" ${disabled?'disabled':''} onclick="pickMtLeft(${i})">
        <span class="badge">${paired?(order.indexOf(i)+1):'–'}</span><span>${esc(q.l[i])}</span></button>`;
    }).join('');
    const rightHtml = item.rOrder.map(j=>{
      const owner = order.find(i => pairs[i] === j);
      return `<button class="mtitem${owner!==undefined?' paired':''}" ${disabled?'disabled':''} onclick="pickMtRight(${j})">
        <span class="badge">${owner!==undefined?(order.indexOf(owner)+1):'–'}</span><span>${esc(q.r[j])}</span></button>`;
    }).join('');
    return `<div class="mtgrid">
      <div><div class="mtcol">項目</div>${leftHtml}</div>
      <div><div class="mtcol">対応するもの</div>${rightHtml}</div></div>`;
  }
  return '';
}

function typeHint(item){
  if(item.type === 'ms') return item.ref.n ? `${item.ref.n}つ選択してください。全部合って初めて得点になります。`
                                           : '正しいものをすべて選択してください。';
  if(item.type === 'ord') return '正しい順に選んでください。選んだ順に番号が振られます。順序も含めて全部合う必要があります。';
  if(item.type === 'mt')  return '左の項目をタップしてから、対応する右をタップしてください。全ペア正解で得点になります。';
  return '最も適切なものを1つ選択してください。';
}

function renderExam(){
  const item = S.qs[S.i];
  const answered = S.qs.filter((it,n)=>isAnswered(it, S.ans[n])).length;
  const canReset = item.type === 'ord' || item.type === 'mt' || item.type === 'ms';

  el('app').innerHTML = `
    <div class="card">
      <div class="qhead">
        <span class="qno">問 ${S.i+1} / ${S.qs.length}</span>
        <span class="qdom">${domName(domOf(item.ref.c))}</span>
        <span class="qtype">${TYPE_LABEL[item.type]}</span>
        <span class="sub" style="margin-left:auto">解答済み ${answered} / ${S.qs.length}</span>
      </div>
      <div class="qtext">${esc(item.ref.q)}</div>
      <div class="hint">${typeHint(item)}</div>
      ${optionsHtml(item, S.i, false)}
      <div class="nav">
        <button class="btn btn-sub" onclick="go(-1)" ${S.i===0?'disabled':''}>← 前の問題</button>
        ${canReset ? `<button class="btn btn-sub" onclick="resetAns()">やり直す</button>` : ''}
        <button class="flagbtn${S.flags[S.i]?' on':''}" onclick="toggleFlag()">${S.flags[S.i]?'🚩 見直す':'⚐ 後で見直す'}</button>
        <span class="spacer"></span>
        ${S.i === S.qs.length-1
          ? `<button class="btn btn-main" onclick="confirmFinish()">採点する</button>`
          : `<button class="btn btn-main" onclick="go(1)">次の問題 →</button>`}
      </div>
    </div>
    <div class="card">
      <h2>解答状況</h2>
      <div class="grid">
        ${S.qs.map((it,n)=>`<button class="gcell${isAnswered(it,S.ans[n])?' done':''}${S.flags[n]?' flag':''}${n===S.i?' cur':''}"
           onclick="jump(${n})">${n+1}</button>`).join('')}
      </div>
      <div class="legend">
        <span><i style="background:#FDF0E3;border-color:#E0A97A"></i>解答済み</span>
        <span><i style="background:#FFF6D9;border-color:#B8860B"></i>見直し</span>
        <span><i style="background:#fff"></i>未解答</span>
      </div>
      <div class="nav"><button class="btn btn-sub" onclick="confirmFinish()">採点する</button></div>
    </div>`;
}

/* ---------- 解答の操作（すべて元データのindexで記録する） ---------- */
function pickMc(orig){ S.ans[S.i] = orig; render(); }
function pickMs(orig){
  const cur = S.ans[S.i] || [];
  S.ans[S.i] = cur.includes(orig) ? cur.filter(x=>x!==orig) : [...cur, orig];
  render();
}
function pickOrd(orig){
  const cur = S.ans[S.i] || [];
  if(cur.includes(orig)) return;          // 同じ選択肢は一度だけ
  S.ans[S.i] = [...cur, orig];
  render();
}
function pickMtLeft(i){
  const cur = S.ans[S.i] || {};
  if(cur[i] !== undefined){ const n = {...cur}; delete n[i]; S.ans[S.i] = n; S.mtLeft = null; }
  else S.mtLeft = (S.mtLeft === i) ? null : i;
  render();
}
function pickMtRight(j){
  if(S.mtLeft === null || S.mtLeft === undefined){ alert('先に左の項目を選んでください。'); return; }
  const cur = {...(S.ans[S.i] || {})};
  // その右項目が既に他の左と組んでいたら解除する（一対一を保つ）
  Object.keys(cur).forEach(k => { if(cur[k] === j) delete cur[k]; });
  cur[S.mtLeft] = j;
  S.ans[S.i] = cur; S.mtLeft = null;
  render();
}
function resetAns(){ delete S.ans[S.i]; S.mtLeft = null; render(); }
function go(d){ S.i = Math.min(S.qs.length-1, Math.max(0, S.i + d)); S.mtLeft = null; render(); }
function jump(n){ S.i = n; S.mtLeft = null; render(); }
function toggleFlag(){ S.flags[S.i] = !S.flags[S.i]; render(); }

function confirmFinish(){
  const un = S.qs.filter((it,n)=>!isAnswered(it, S.ans[n])).length;
  const msg = un > 0 ? `未解答または解答が未完成の問題が ${un} 問あります。これらは誤答として採点されます。採点しますか？`
                     : '採点しますか？';
  if(confirm(msg)) finish(false);
}

function finish(byTimeout){
  stopTimer();
  const r = grade(); r.byTimeout = !!byTimeout; S.result = r;
  const wrong = loadWrong();
  S.qs.forEach((item, idx) => {
    if(isCorrect(item, S.ans[idx])) delete wrong[item.ref.id];
    else wrong[item.ref.id] = (wrong[item.ref.id] || 0) + 1;
  });
  saveWrong(wrong);
  const hist = loadHist();
  hist.unshift({ at:r.at, scaled:r.scaled, domains:r.domains, pass:r.pass, correct:r.correct, count:r.count });
  saveHist(hist.slice(0, 50));
  S.view = 'result'; render();
}

function renderResult(){
  el('timer').style.display = 'none';
  const r = S.result;
  el('app').innerHTML = `
    <div class="card" style="text-align:center">
      ${r.byTimeout ? `<p class="sub" style="color:var(--ng)">⏰ 制限時間に達したため自動採点しました</p>` : ''}
      <div class="big">${r.scaled}<small> / 1000</small></div>
      <div class="verdict ${r.pass?'pass':'fail'}">${r.pass?'合格ライン到達':'不合格'}</div>
      <p class="sub">${r.correct} / ${r.count} 問正解（解答 ${r.answered} 問）／ 合格ライン ${PASS_SCORE}</p>
    </div>
    <div class="card">
      <h2>ドメイン別の正答率</h2>
      <p class="note" style="margin-bottom:12px">
        AIF-C01はドメイン別の合格ラインがなく総合点のみで判定されますが、
        弱い分野を把握する目安になります。</p>
      ${r.domains.map(d=>`
        <div class="frow">
          <div class="t"><span>${d.name}<span class="sub">（${d.correct}/${d.total}問）</span></span>
            <strong style="color:${d.pct>=70?'var(--ok)':d.pct>=50?'var(--warn)':'var(--ng)'}">${d.pct}%</strong></div>
          <div class="fbar"><i style="width:${d.pct}%;background:${d.pct>=70?'var(--ok)':d.pct>=50?'var(--warn)':'var(--ng)'}"></i></div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="nav">
        <button class="btn btn-main" onclick="S.reviewIdx=0;S.view='review';render()">解答を確認する</button>
        <button class="btn btn-sub" onclick="start()">もう一度受験する</button>
        <button class="btn btn-sub" onclick="S.view='home';render()">トップへ戻る</button>
      </div>
    </div>`;
}

function renderReview(){
  const wrongIdx = S.qs.map((it,i)=>({it,i})).filter(x=>!isCorrect(x.it, S.ans[x.i])).map(x=>x.i);
  const list = wrongIdx.length ? wrongIdx : S.qs.map((_,i)=>i);
  const idx = list[Math.min(S.reviewIdx, list.length-1)];
  const item = S.qs[idx], q = item.ref, marks = ['A','B','C','D','E','F'];
  const mine = S.ans[idx];

  let body = '';
  if(item.type === 'mc' || item.type === 'ms'){
    const ok = item.type === 'mc' ? [q.a] : q.a;
    const sel = item.type === 'mc' ? (mine===undefined?[]:[mine]) : (mine||[]);
    body = item.order.map((orig,pos)=>{
      let cls = '';
      if(ok.includes(orig)) cls = ' correct';
      else if(sel.includes(orig)) cls = ' wrong';
      return `<div class="opt${cls}"><span class="mk">${marks[pos]}</span><span>${esc(q.o[orig])}
        ${ok.includes(orig)?' <strong style="color:var(--ok)">← 正解</strong>':''}
        ${sel.includes(orig)&&!ok.includes(orig)?' <strong style="color:var(--ng)">← あなたの解答</strong>':''}</span></div>`;
    }).join('');
  } else if(item.type === 'ord'){
    const picks = mine || [];
    body = q.a.map((orig,pos)=>`<div class="opt${picks[pos]===orig?' correct':' wrong'}">
      <span class="mk">${pos+1}</span><span>${esc(q.o[orig])}</span></div>`).join('')
      + (picks.length ? `<p class="note">あなたの並び：${picks.map((o,i)=>(i+1)+'. '+q.o[o]).join(' ／ ')}</p>`
                      : `<p class="note" style="color:var(--ng)">未解答でした。</p>`);
  } else {
    const pairs = mine || {};
    body = q.l.map((lv,i)=>`<div class="mtitem${pairs[i]===q.a[i]?' correct':' wrong'}">
      <span class="badge">${i+1}</span><span>${esc(lv)} → <strong>${esc(q.r[q.a[i]])}</strong>
      ${pairs[i]!==undefined && pairs[i]!==q.a[i] ? `<span style="color:var(--ng)">（あなたの解答：${esc(q.r[pairs[i]])}）</span>` : ''}
      ${pairs[i]===undefined ? `<span style="color:var(--ng)">（未解答）</span>` : ''}</span></div>`).join('');
  }

  el('app').innerHTML = `
    <div class="card">
      <div class="qhead">
        <span class="qno">問 ${idx+1}</span>
        <span class="qdom">${domName(domOf(q.c))}</span>
        <span class="qtype">${TYPE_LABEL[item.type]}</span>
        <span class="sub" style="margin-left:auto">
          ${wrongIdx.length ? `間違えた問題 ${S.reviewIdx+1} / ${list.length}` : `全問正解のため全 ${list.length} 問を表示`}</span>
      </div>
      <div class="qtext">${esc(q.q)}</div>
      ${body}
      <div class="expl">${esc(q.e)}</div>
      <div class="nav">
        <button class="btn btn-sub" onclick="S.reviewIdx=Math.max(0,S.reviewIdx-1);render()" ${S.reviewIdx===0?'disabled':''}>← 前</button>
        <span class="spacer"></span>
        ${S.reviewIdx < list.length-1
          ? `<button class="btn btn-main" onclick="S.reviewIdx++;render()">次 →</button>`
          : `<button class="btn btn-main" onclick="S.view='result';render()">結果に戻る</button>`}
      </div>
    </div>`;
}

function clearHist(){
  if(!confirm('受験履歴を消去しますか？（間違えた問題の記録は残ります）')) return;
  saveHist([]); render();
}

CloudStore.init([HIST_KEY, WRONG_KEY]).then(()=>{
  render();
  CloudStore.onChange(()=>{ if(S.view === 'home') render(); });
}).catch(e=>{
  el('app').innerHTML = `<div class="card"><h1>接続できませんでした</h1>
    <p class="note">${esc(e.message)}<br>ページを再読み込みしてください。</p></div>`;
});

window.addEventListener('beforeunload', e => { if(S.view === 'exam'){ e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
