<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新しい資格を作る — Study Deck</title>
<!-- ============================================================
     カスタム資格（ユーザー作成資格）の新規作成フロー。

     既存資格（CLF-C02・ITパスポート・FE）は cert.js / data.js が
     リポジトリにコミットされた静的ファイルとして存在するが、
     ここで作る資格はカテゴリもカードもすべてFirestoreに置く「完全動的」な資格。
     GitHub Pagesは静的サイトで、閲覧者がその場でファイルをコミットできないため。

     ステップ1：資格名・説明・ID  →  ステップ2：カテゴリ編集  →  作成
     作成後は index.html?id=<資格ID> へ移動してカードを追加する。

     ?ns=dev を付けると検証用の名前空間（app/notebook-*-dev）で動く。
     CLAUDE.md 第28節を参照。
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_engine/theme.css?v=2">
<link rel="stylesheet" href="../_engine/app.css?v=10">
<script src="../_engine/icons.js?v=2"></script>
<style>
  body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.6;}
  *{margin:0;padding:0;box-sizing:border-box;}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">
    <div class="logo-icon"><svg class="ico"><use href="#i-plus"></use></svg></div>
    <span class="logo-word">新しい資格を作る</span>
  </div>
  <div class="header-right">
    <a class="btn-icon" id="back-link" href="../index.html" aria-label="資格一覧へ"><svg class="ico"><use href="#i-home"></use></svg></a>
  </div>
</header>

<div class="wiz">
  <div class="wiz-steps"><div class="wiz-dot on" id="dot1"></div><div class="wiz-dot" id="dot2"></div></div>

  <!-- ステップ1：資格名・説明・ID -->
  <div class="wiz-step active" id="step1">
    <div class="wiz-title">どんな資格をつくりますか？</div>
    <div class="wiz-sub">単語帳だけのシンプルな資格を作ります。あとから何度でも編集できます。</div>

    <div class="form-group">
      <label for="f-name">資格名</label>
      <input type="text" id="f-name" placeholder="例: 英検準1級" maxlength="40" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="f-desc">説明（任意）</label>
      <input type="text" id="f-desc" placeholder="例: 単語と熟語の暗記用" maxlength="60" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="f-id">ID（URLと保存先に使います）</label>
      <div class="id-line">
        <span class="id-prefix">u-</span>
        <input type="text" id="f-id" placeholder="eiken" maxlength="29" autocomplete="off" spellcheck="false">
      </div>
      <div class="id-msg" id="id-msg"></div>
    </div>

    <div class="wiz-actions">
      <a class="btn btn-secondary" id="cancel-link" href="../index.html">キャンセル</a>
      <button class="btn btn-primary" style="width:auto;" id="to-step2" disabled>次へ：カテゴリ</button>
    </div>
  </div>

  <!-- ステップ2：カテゴリ編集 -->
  <div class="wiz-step" id="step2">
    <div class="wiz-title">カテゴリを決める</div>
    <div class="wiz-sub">
      単語帳はカテゴリごとに出題できます。あとから追加・改名・削除・並べ替えができるので、
      ここでは思いつくものだけで大丈夫です。
    </div>
    <div id="cat-host"></div>
    <div class="wiz-actions">
      <button class="btn btn-secondary" id="to-step1">戻る</button>
      <button class="btn btn-primary" style="width:auto;" id="do-create">この内容で作る</button>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="../_engine/store.js?v=1"></script>
<script src="../_engine/custom-store.js?v=1"></script>
<script src="../_engine/cat-editor.js?v=1"></script>
<script>
(function(){
  const CC = window.CustomCerts;
  CC.adoptNamespaceFromUrl();
  const NSQ = CC.namespace() ? '?ns=dev' : '';

  /* 名前空間を引き継いだリンクにしておく（検証中に本番へ迷い込まないように） */
  document.getElementById('back-link').href   = '../index.html' + NSQ;
  document.getElementById('cancel-link').href = '../index.html' + NSQ;
  if(CC.namespace()){
    document.querySelector('.logo-word').textContent += '（検証用）';
  }

  let taken = [];          // 既に使われている資格ID
  let idTouched = false;   // ユーザーがID欄を自分で編集したか
  let editor = null;

  const $ = function(id){ return document.getElementById(id); };
  const nameEl = $('f-name'), descEl = $('f-desc'), idEl = $('f-id'), msgEl = $('id-msg');

  function toast(msg, type){
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || 'success');
    setTimeout(function(){ t.className = 'toast'; }, 2600);
  }

  function fullId(){ return CC.ID_PREFIX + idEl.value.trim(); }

  function validate(){
    const name = nameEl.value.trim();
    const chk  = CC.checkId(fullId(), taken);
    const okAll = !!name && chk.ok;

    if(!idEl.value.trim()){
      msgEl.textContent = '';
      msgEl.className = 'id-msg';
    }else if(chk.ok){
      msgEl.textContent = '保存先: app/' + CC.certDocName(fullId());
      msgEl.className = 'id-msg ok';
    }else{
      msgEl.textContent = chk.reason;
      msgEl.className = 'id-msg ng';
    }
    $('to-step2').disabled = !okAll;
    return okAll;
  }

  nameEl.addEventListener('input', function(){
    if(!idTouched){
      /* 資格名からIDを自動生成する。日本語だけの名前は英字が拾えないので
         u-cert-1 のような連番になる（ユーザーが手で直せる）。 */
      const s = CC.suggestId(nameEl.value, taken);
      idEl.value = s.slice(CC.ID_PREFIX.length);
    }
    validate();
  });
  idEl.addEventListener('input', function(){
    idTouched = true;
    idEl.value = idEl.value.toLowerCase();
    validate();
  });

  $('to-step2').addEventListener('click', function(){
    if(!validate()) return;
    if(!editor){
      editor = CatEditor.mount($('cat-host'), {
        cats: [{id: CC.newCatId([]), name: 'カテゴリ1'}],
        customCards: {},
      });
    }
    $('step1').classList.remove('active');
    $('step2').classList.add('active');
    $('dot2').classList.add('on');
  });

  $('to-step1').addEventListener('click', function(){
    $('step2').classList.remove('active');
    $('step1').classList.add('active');
    $('dot2').classList.remove('on');
  });

  $('do-create').addEventListener('click', async function(){
    const btn = this;
    if(!validate()){ toast('資格名とIDを確認してください', 'error'); return; }
    btn.disabled = true;
    btn.textContent = '作成中…';
    try{
      const r = await CC.createCert({
        id:   fullId(),
        name: nameEl.value.trim(),
        desc: descEl.value.trim(),
        cats: editor.result().cats,
      });
      if(!r.ok){
        toast(r.reason, 'error');
        btn.disabled = false; btn.textContent = 'この内容で作る';
        /* 衝突は入力し直してもらう（ステップ1へ戻す） */
        $('step2').classList.remove('active');
        $('step1').classList.add('active');
        taken = (await CC.listCerts()).map(function(c){ return c.id; });
        validate();
        return;
      }
      location.href = 'index.html?id=' + encodeURIComponent(r.id) + (CC.namespace() ? '&ns=dev' : '');
    }catch(e){
      console.error(e);
      toast('作成に失敗しました：' + e.message, 'error');
      btn.disabled = false; btn.textContent = 'この内容で作る';
    }
  });

  /* 既存IDを読み込んでから入力を受け付ける */
  (async function init(){
    try{
      taken = (await CC.listCerts()).map(function(c){ return c.id; });
    }catch(e){
      console.warn('索引を読めませんでした', e);
      toast('接続できませんでした。作成できない場合があります', 'error');
    }
    nameEl.focus();
    validate();
  })();
})();
</script>
</body>
</html>
