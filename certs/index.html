<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AWS Study Deck — 資格一覧</title>
<!-- ============================================================
     資格横断のダッシュボード。
     資格を追加したら CERTS 配列に1件足す（CLAUDE.md 10-2節）。
     このページは学習データを読み書きしない（表示のみ）。
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_engine/theme.css?v=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.6;}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 60px;}
.hub-head{text-align:center;margin-bottom:30px;}
.hub-logo{font-family:var(--disp);font-size:26px;font-weight:700;margin-bottom:6px;}
.hub-logo span{color:var(--orange);}
.hub-sub{color:var(--dim);font-size:13.5px;}
.cert-card{display:block;text-decoration:none;color:inherit;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:13px;transition:all .15s;}
.cert-card:hover{border-color:var(--orange);transform:translateY(-2px);}
.cert-card.locked{opacity:.55;cursor:default;}
.cert-card.locked:hover{border-color:var(--line);transform:none;}
.cert-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
.cert-icon{font-size:23px;}
.cert-code{font-family:var(--disp);font-size:17px;font-weight:700;}
.cert-name{color:var(--dim);font-size:13px;}
.cert-desc{color:var(--dim);font-size:12.5px;margin-top:9px;}
.badge{font-size:11px;font-weight:700;border-radius:20px;padding:3px 11px;margin-left:auto;white-space:nowrap;}
.badge.done{background:var(--ok);color:#04201C;}
.badge.active{background:var(--orange);color:#161006;}
.badge.soon{background:var(--card2);color:var(--dim);border:1px solid var(--line);}
.group-label{color:var(--dim);font-family:var(--disp);font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;margin:22px 0 10px;}
.group-label:first-child{margin-top:0;}
.note{color:var(--dim);font-size:12px;margin-top:26px;text-align:center;line-height:1.9;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hub-head">
    <div class="hub-logo">☁️ AWS <span>Study Deck</span></div>
    <div class="hub-sub">資格ごとの学習アプリ</div>
  </div>
  <div id="cert-list"></div>
  <div class="note">
    各資格の学習データはそれぞれ別に保存されています。<br>
    片方の学習記録がもう片方に影響することはありません。
  </div>
</div>

<script>
/* 資格を追加したらここに1件足す。href が null のものは準備中として表示する。
   group はこのページの見出しの分けかた（取得順に並べている）。 */
const CERTS = [
  { group:'国家資格',
    code:'ITパスポート', name:'情報処理技術者試験（IP）', icon:'🗾',
    href:'itpass/index.html', status:'active',
    desc:'100問／120分・四肢択一。総合600点かつストラテジ・マネジメント・テクノロジの各分野で300点以上が必要' },

  { group:'AWS認定',
    code:'CLF-C02', name:'クラウドプラクティショナー', icon:'☁️',
    href:'aws/clf/index.html', status:'done',
    desc:'単語帳151枚・過去問67問・シナリオ152問・複数選択40問・模試195問・ハンズオン道場' },
  { group:'AWS認定',
    code:'AIF-C01', name:'AIプラクティショナー', icon:'🤖',
    href:'aws/aif/index.html', status:'active',
    desc:'65問／90分。択一式・複数選択式に加え、順序問題とマッチング問題が出題される' },
  { group:'AWS認定',
    code:'SAA-C03', name:'ソリューションアーキテクト アソシエイト', icon:'🏗️',
    href:null, status:'soon',
    desc:'シナリオ問題とサービス比較を厚くする予定' },
  { group:'AWS認定',
    code:'SOA-C03', name:'クラウドオプス エンジニア アソシエイト', icon:'🛠️',
    href:null, status:'soon',
    desc:'ハンズオン道場を主役に再設計する予定' },
  { group:'AWS認定',
    code:'SAP-C02', name:'ソリューションアーキテクト プロフェッショナル', icon:'🧭',
    href:null, status:'soon',
    desc:'長文シナリオUIと問題別タイマーを新規実装する予定' },
  { group:'AWS認定',
    code:'SCS-C03 / DOP-C02', name:'セキュリティ ／ デブオプス', icon:'🔐',
    href:null, status:'soon',
    desc:'どちらを受験するか検討中' },
];

const BADGE = { done:['合格済み','done'], active:['学習中','active'], soon:['準備中','soon'] };

const groups = [...new Set(CERTS.map(c=>c.group))];
document.getElementById('cert-list').innerHTML = groups.map(g=>{
  const cards = CERTS.filter(c=>c.group===g).map(c=>{
    const [label, cls] = BADGE[c.status];
    const inner = `
      <div class="cert-top">
        <span class="cert-icon">${c.icon}</span>
        <span class="cert-code">${c.code}</span>
        <span class="cert-name">${c.name}</span>
        <span class="badge ${cls}">${label}</span>
      </div>
      <div class="cert-desc">${c.desc}</div>`;
    return c.href
      ? `<a class="cert-card" href="${c.href}">${inner}</a>`
      : `<div class="cert-card locked">${inner}</div>`;
  }).join('');
  return `<div class="group-label">${g}</div>${cards}`;
}).join('');
</script>
</body>
</html>
