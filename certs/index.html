<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AWS Study Deck — 資格一覧</title>
<!-- ============================================================
     資格横断のダッシュボード。
     資格を追加したら CERTS 配列に1件足す（CLAUDE.md 10-2節）。
     このページは学習データを読み書きしない（表示のみ）。
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_engine/theme.css?v=2">
<script src="_engine/icons.js?v=2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.6;}
.wrap{max-width:760px;margin:0 auto;padding:26px 18px 60px;}
.hub-head{text-align:center;margin-bottom:30px;}
/* ロゴはワードマーク扱い。折り返さず、幅が足りないときはフォントサイズだけで縮む。 */
.hub-logo{font-family:var(--disp);font-size:clamp(18px,6vw,26px);font-weight:700;margin-bottom:6px;
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;max-width:100%;}
.hub-logo-icon{width:clamp(22px,7vw,28px);height:clamp(22px,7vw,28px);flex:none;border-radius:8px;
  background:linear-gradient(135deg,var(--orange),#E68A00);display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 2px 8px rgba(255,153,0,.3);}
.hub-logo-icon .ico{width:58%;height:58%;}
.hub-logo-word{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hub-logo span{color:var(--orange);}
.hub-sub{color:var(--dim);font-size:13.5px;}
.cert-card{display:block;text-decoration:none;color:inherit;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:13px;transition:all .15s;}
.cert-card:hover{border-color:var(--orange);transform:translateY(-2px);}
.cert-card.locked{opacity:.55;cursor:default;}
.cert-card.locked:hover{border-color:var(--line);transform:none;}
.cert-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
.cert-icon{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;}
.cert-icon .ico{width:56%;height:56%;}
.cert-icon.st-done{background:linear-gradient(135deg,var(--ok),#12A38F);}
.cert-icon.st-active{background:linear-gradient(135deg,var(--orange),#E68A00);}
.cert-icon.st-soon{background:var(--card2);color:var(--dim);}
.cert-code{font-family:var(--disp);font-size:17px;font-weight:700;}
.cert-name{color:var(--dim);font-size:13px;}
.cert-desc{color:var(--dim);font-size:12.5px;margin-top:9px;}
.badge{font-size:11px;font-weight:700;border-radius:20px;padding:3px 11px;margin-left:auto;white-space:nowrap;}
.badge.done{background:var(--ok);color:#04201C;}
.badge.active{background:var(--orange);color:#161006;}
.badge.soon{background:var(--card2);color:var(--dim);border:1px solid var(--line);}
.group-label{color:var(--dim);font-family:var(--disp);font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;margin:22px 0 10px;}
.group-label:first-child{margin-top:0;}
.note{color:var(--dim);font-size:12px;margin-top:26px;text-align:center;line-height:1.9;}
.roadmap-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
  background:linear-gradient(135deg,rgba(56,189,248,.10),rgba(255,153,0,.06));
  border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:24px;transition:all .15s;}
.roadmap-link:hover{border-color:var(--blue);transform:translateY(-2px);}
.roadmap-link-icon{width:38px;height:38px;flex:none;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),#1D8FD1);display:flex;align-items:center;
  justify-content:center;color:#fff;}
.roadmap-link-icon .ico{width:56%;height:56%;}
.roadmap-link-title{font-family:var(--disp);font-weight:700;font-size:15px;}
.roadmap-link-sub{color:var(--dim);font-size:12px;margin-top:2px;}
.roadmap-link-arrow{margin-left:auto;color:var(--dim);flex:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hub-head">
    <div class="hub-logo"><span class="hub-logo-icon"><svg class="ico"><use href="#i-cloud"></use></svg></span><span class="hub-logo-word">AWS <span>Study Deck</span></span></div>
    <div class="hub-sub">資格ごとの学習アプリ</div>
  </div>
  <a class="roadmap-link" href="roadmap/index.html">
    <span class="roadmap-link-icon"><svg class="ico"><use href="#i-map"></use></svg></span>
    <div>
      <div class="roadmap-link-title">資格ロードマップ</div>
      <div class="roadmap-link-sub">取得順序・勉強時間・進捗をまとめて管理</div>
    </div>
    <span class="roadmap-link-arrow"><svg class="ico"><use href="#i-arrow-right"></use></svg></span>
  </a>
  <div id="cert-list"></div>
  <!-- ユーザーが作った資格（Firestoreの索引 app/notebook-index から動的に描画）。
       上の一覧（コミット済みの静的な資格）とは成り立ちが違うので節を分けてある。 -->
  <div id="custom-list"></div>
  <div class="note">
    各資格の学習データはそれぞれ別に保存されています。<br>
    片方の学習記録がもう片方に影響することはありません。
  </div>
</div>

<script>
/* 資格を追加したらここに1件足す。href が null のものは準備中として表示する。
   一覧の対象・並び順は資格ロードマップの計画資料（ローカル管理）を
   唯一の正とする（2026-08-17、さくらさんの指示）。MDに無い資格は載せない。
   group はフェーズ名（MDのphaseとそろえてある）。 */
const CERTS = [
  { group:'フェーズ0以前',
    code:'CLF-C02', name:'クラウドプラクティショナー', icon:'cloud',
    href:'aws/clf/index.html', status:'done',
    desc:'単語帳151枚・過去問67問・シナリオ152問・複数選択40問・模試195問・ハンズオン道場' },

  { group:'フェーズ0',
    code:'ITパスポート', name:'情報処理技術者試験（IP）', icon:'passport',
    href:'itpass/index.html', status:'active',
    desc:'100問／120分・四肢択一。総合600点かつストラテジ・マネジメント・テクノロジの各分野で300点以上が必要' },

  { group:'フェーズ1',
    code:'基本情報技術者', name:'IPA レベル2', icon:'book',
    href:'fe/index.html', status:'active',
    desc:'単語帳160枚・科目A 72問・科目B 24問（擬似言語）・シナリオ35問・チートシート9本。応用情報より先に取得する' },
  { group:'フェーズ1',
    code:'SAA-C03', name:'ソリューションアーキテクト アソシエイト', icon:'blueprint',
    href:null, status:'soon',
    desc:'受験日確定済み（2026-11頃）。シナリオ問題とサービス比較を厚くする予定' },
  { group:'フェーズ1',
    code:'SOA-C03', name:'クラウドオプス エンジニア アソシエイト', icon:'wrench',
    href:null, status:'soon',
    desc:'SAA合格後、1〜2ヶ月を目安に着手。ハンズオン道場を主役に再設計する予定' },
  { group:'フェーズ1',
    code:'応用情報技術者', name:'IPA レベル3', icon:'doc-check',
    href:null, status:'soon',
    desc:'基本情報の合格後に着手。合格で高度試験の午前I試験が2年間免除される' },

  { group:'フェーズ1後半',
    code:'SAP-C02', name:'ソリューションアーキテクト プロフェッショナル', icon:'compass',
    href:null, status:'soon',
    desc:'最重要資格。長文シナリオUIと問題別タイマーを新規実装する予定' },
  { group:'フェーズ1後半',
    code:'SCS-C03', name:'セキュリティ スペシャリティ', icon:'lock',
    href:null, status:'soon',
    desc:'IAMポリシーのJSON読解など、AWS内スコープのセキュリティ設計力を問う' },

  { group:'フェーズ2',
    code:'情報処理安全確保支援士', name:'IPA 高度（レベル4）', icon:'shield',
    href:null, status:'soon',
    desc:'SCS-C03と補完関係。クラウド事業者非依存のセキュリティ設計・監査能力の国家資格' },
  { group:'フェーズ2',
    code:'システムアーキテクト', name:'IPA 高度（レベル4）', icon:'map',
    href:null, status:'soon',
    desc:'資格名が目指す職種名と直結。SCとは半年〜1年空けて着手すること' },

  { group:'フェーズ2（条件付き）',
    code:'DOP-C02', name:'デブオプスエンジニア プロフェッショナル', icon:'toolbox',
    href:null, status:'soon',
    desc:'保留中。フェーズ2の時点で取得するかどうかを判断する条件付きプラン' },
];

const BADGE = { done:['合格済み','done'], active:['学習中','active'], soon:['準備中','soon'] };

const groups = [...new Set(CERTS.map(c=>c.group))];
document.getElementById('cert-list').innerHTML = groups.map(g=>{
  const cards = CERTS.filter(c=>c.group===g).map(c=>{
    const [label, cls] = BADGE[c.status];
    const inner = `
      <div class="cert-top">
        <span class="cert-icon st-${c.status}"><svg class="ico"><use href="#i-${c.icon}"></use></svg></span>
        <span class="cert-code">${c.code}</span>
        <span class="cert-name">${c.name}</span>
        <span class="badge ${cls}">${label}</span>
      </div>
      <div class="cert-desc">${c.desc}</div>`;
    return c.href
      ? `<a class="cert-card" href="${c.href}">${inner}</a>`
      : `<div class="cert-card locked">${inner}</div>`;
  }).join('');
  return `<div class="group-label">${g}</div>${cards}`;
}).join('');
</script>

<!-- ─── ユーザー作成資格（カスタム資格） ─────────────────────
     静的な CERTS 配列とは別に、Firestoreの索引から読んで描画する。
     索引が読めない・空でも「＋ 新しい資格を作る」だけは必ず出す
     （クラウドが落ちても上の一覧は静的なのでそのまま使える）。 -->
<script src="_engine/store.js?v=1"></script>
<script src="_engine/custom-store.js?v=1"></script>
<script>
(async function renderCustomCerts(){
  const CC = window.CustomCerts;
  CC.adoptNamespaceFromUrl();
  const nsq  = CC.namespace() ? '?ns=dev' : '';
  const nsq2 = CC.namespace() ? '&ns=dev' : '';
  const host = document.getElementById('custom-list');

  const newBtn = `<a class="cert-card" href="custom/new.html${nsq}" style="border-style:dashed;text-align:center;">
      <span class="cert-icon st-soon" style="display:inline-flex;vertical-align:middle;margin-right:9px;"><svg class="ico"><use href="#i-plus"></use></svg></span>
      <span class="cert-code" style="font-size:15px;">新しい資格を作る</span>
    </a>`;

  function label(){
    return `<div class="group-label">自分で作った資格${CC.namespace() ? '（検証用）' : ''}</div>`;
  }

  let certs = [];
  try{
    certs = await CC.listCerts();
  }catch(e){
    console.warn('カスタム資格の索引を読めませんでした', e);
    host.innerHTML = label() +
      `<div class="cert-card locked"><div class="cert-top">
         <span class="cert-icon st-soon"><svg class="ico"><use href="#i-warning"></use></svg></span>
         <span class="cert-name">接続できませんでした。自分で作った資格は表示できません</span>
       </div></div>` + newBtn;
    return;
  }

  const cards = certs.map(c => {
    const desc = [
      c.desc || '',
      `カード${c.cards || 0}枚・カテゴリ${c.cats || 0}件`,
    ].filter(Boolean).join(' ／ ');
    return `<a class="cert-card" href="custom/index.html?id=${encodeURIComponent(c.id)}${nsq2}">
      <div class="cert-top">
        <span class="cert-icon st-active"><svg class="ico"><use href="#i-card-stack"></use></svg></span>
        <span class="cert-code">${escapeHtml(c.name || c.id)}</span>
        <span class="badge active">単語帳</span>
      </div>
      <div class="cert-desc">${escapeHtml(desc)}</div>
    </a>`;
  }).join('');

  host.innerHTML = label() + cards + newBtn;

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
