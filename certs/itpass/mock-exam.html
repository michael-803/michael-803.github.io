<title>ITパスポート 模擬試験センター</title>
<!-- ============================================================
     ITパスポート 模擬試験（100問／120分）

     ★問題は data.js の QQ（過去問90問）と SCENARIO_Q（シナリオ90問）から
       毎回ランダムに組み立てる。固定の問題セットを持たない設計にしたのは、
       ・同じ180問を出題形式を変えて使い回せる
       ・受験のたびに違う組み合わせになり、順番で覚えてしまうのを防げる
       ため。分野別の配分は本番の目安（35/20/45）に合わせて抽出する。

     ★合否判定は本番の規則どおり「総合600点以上 かつ 3分野それぞれ300点以上」。
       ただし本番のIRT（項目応答理論）は非公開のため再現できない。
       ここでは正答率をそのまま1000点満点に換算した目安として表示している。

     デザインは本試験画面の再現のため白基調のまま（CLAUDE.md 4-5節の方針）。
     単語帳側のダークテーマ（_engine/theme.css）は読み込まない。
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--navy:#123A6B;--navy2:#0E2E55;--line:#D3DCE8;--bg:#F4F7FB;--ink:#16202E;--dim:#5C6B80;
      --ok:#1B8A5A;--ng:#C0392B;--warn:#B8860B;--r:10px;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;min-height:100dvh;}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:11px 16px;
     position:sticky;top:0;z-index:50;flex-wrap:wrap;}
.bar .ttl{font-weight:700;font-size:15px;}
.bar .home{color:#CFE0F5;text-decoration:none;font-size:13px;}
.timer{margin-left:auto;background:#0B2444;border:1px solid #2C5286;border-radius:6px;
       padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;}
.timer.low{background:#5C1A1A;border-color:#8F3030;color:#FFD7D7;animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.wrap{max-width:840px;margin:0 auto;padding:20px 16px 80px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;}
h1{font-size:20px;margin-bottom:6px;}
h2{font-size:16px;margin-bottom:10px;}
.sub{color:var(--dim);font-size:13px;}
.spec{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
.spec th,.spec td{border:1px solid var(--line);padding:8px 10px;text-align:left;}
.spec th{background:#EDF2F9;width:38%;}
.btn{border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;padding:11px 20px;}
.btn-main{background:var(--navy);color:#fff;}
.btn-main:hover{background:var(--navy2);}
.btn-sub{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-sub:hover{border-color:var(--navy);color:var(--navy);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.qno{background:var(--navy);color:#fff;border-radius:6px;padding:3px 11px;font-weight:700;font-size:13px;}
.qfield{background:#EDF2F9;color:var(--navy);border-radius:6px;padding:3px 11px;font-size:12px;font-weight:700;}
.qtext{font-size:15.5px;margin-bottom:16px;white-space:pre-wrap;}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;
     border:1px solid var(--line);border-radius:var(--r);cursor:pointer;font-family:inherit;
     font-size:14.5px;line-height:1.7;padding:13px 15px;margin-bottom:9px;transition:all .12s;}
.opt:hover{border-color:var(--navy);background:#F7FAFE;}
.opt.sel{border-color:var(--navy);background:#E8F0FB;box-shadow:0 0 0 2px rgba(18,58,107,.15);}
.opt .mk{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
         background:#EDF2F9;border:1px solid var(--line);font-weight:700;font-size:13px;}
.opt.sel .mk{background:var(--navy);border-color:var(--navy);color:#fff;}
.opt.correct{border-color:var(--ok);background:#EAF6F0;}
.opt.wrong{border-color:var(--ng);background:#FBEDEB;}
.nav{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px;}
.nav .spacer{margin-left:auto;}
.flagbtn{background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;
         font-family:inherit;font-size:13px;padding:9px 14px;}
.flagbtn.on{background:#FFF6D9;border-color:var(--warn);color:#7A5B00;font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:12px;}
.gcell{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;
       font-family:inherit;font-size:12.5px;padding:7px 0;text-align:center;}
.gcell.done{background:#E8F0FB;border-color:#9BB8DC;}
.gcell.flag{background:#FFF6D9;border-color:var(--warn);}
.gcell.cur{outline:2px solid var(--navy);outline-offset:1px;font-weight:700;}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:9px;}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px;}
.big{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;}
.big small{font-size:14px;font-weight:700;color:var(--dim);}
.verdict{display:inline-block;border-radius:8px;padding:7px 18px;font-weight:900;font-size:17px;margin:8px 0;}
.verdict.pass{background:#EAF6F0;color:var(--ok);border:2px solid var(--ok);}
.verdict.fail{background:#FBEDEB;color:var(--ng);border:2px solid var(--ng);}
.fbar{height:9px;background:#EDF2F9;border-radius:5px;overflow:hidden;margin-top:5px;}
.fbar i{display:block;height:100%;}
.frow{margin-bottom:14px;}
.frow .t{display:flex;justify-content:space-between;font-size:13.5px;}
.expl{background:#F7FAFE;border-left:3px solid var(--navy);border-radius:0 8px 8px 0;
      padding:12px 14px;margin-top:10px;font-size:13.5px;white-space:pre-wrap;}
.hist{width:100%;border-collapse:collapse;font-size:13px;}
.hist th,.hist td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
.hist th{color:var(--dim);font-weight:700;}
.note{color:var(--dim);font-size:12.5px;line-height:1.9;}
@media(max-width:600px){
  .wrap{padding:14px 12px 70px;} .card{padding:15px;} .qtext{font-size:14.5px;}
  .opt{font-size:13.5px;padding:11px 12px;} .big{font-size:34px;}
}
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="index.html">⬅ Study Deck</a>
  <span class="ttl">ITパスポート 模擬試験</span>
  <span class="timer" id="timer" style="display:none;">残り --:--</span>
</div>
<div class="wrap" id="app"></div>

<script src="../_engine/store.js?v=1"></script>
<script src="cert.js?v=1"></script>
<script>window.SAFESTORE_HOME_DOC = window.CERT.doc; window.SAFESTORE_STANDALONE = true;</script>
<script src="../_engine/safe-store.js?v=2"></script>
<script src="../_engine/safe-store-compat.js?v=1"></script>
<script src="data.js?v=1"></script>
<script>
/* ============================================================
   本番の規則（IPA・CLAUDE.md 17-1節）
     100問／120分／四肢択一
     合格＝総合600点以上（1000点満点）かつ3分野それぞれ300点以上
     分野別の出題数の目安：ストラテジ35／マネジメント20／テクノロジ45
   ============================================================ */
const TOTAL_Q   = 100;
const LIMIT_MIN = 120;
const PASS_TOTAL = 600;
const PASS_FIELD = 300;

const FIELDS = [
  {id:'st', name:'ストラテジ系',   cats:['corp','strategy','syssta'], n:35},
  {id:'mn', name:'マネジメント系', cats:['dev','pm','sm'],            n:20},
  {id:'tc', name:'テクノロジ系',   cats:['theory','comp','tech'],     n:45},
];
const fieldOf = catId => (FIELDS.find(f => f.cats.includes(catId)) || {}).id;
const fieldName = fid => (FIELDS.find(f => f.id === fid) || {}).name || fid;

const HIST_KEY  = 'ipMockHistoryV1';
const WRONG_KEY = 'ipMockWrongV1';

const S = { view:'home', qs:[], i:0, ans:{}, flags:{}, endAt:0, timerInt:null, result:null, reviewIdx:0 };

const el   = id => document.getElementById(id);
const esc  = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad  = n => String(n).padStart(2,'0');
const fmt  = ms => { const s = Math.max(0, Math.floor(ms/1000)); return pad(Math.floor(s/60)) + ':' + pad(s%60); };

function shuffle(a){ const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r; }

/* ---------- 問題の組み立て ----------
   過去問（QQ）とシナリオ（SCENARIO_Q）を母集団にして、分野ごとに必要数を抽出する。
   母数が足りない分野があっても落ちないよう、不足分は他分野から補う。 */
function buildExam(){
  const pool = [...QQ, ...SCENARIO_Q];
  const picked = [];
  const used = new Set();
  FIELDS.forEach(f=>{
    const cand = shuffle(pool.filter(q => f.cats.includes(q.c)));
    cand.slice(0, f.n).forEach(q => { picked.push(q); used.add(q.id); });
  });
  if(picked.length < TOTAL_Q){
    shuffle(pool.filter(q => !used.has(q.id))).slice(0, TOTAL_Q - picked.length)
      .forEach(q => picked.push(q));
  }
  // 出題順はシャッフルし、選択肢の表示順も設問ごとに固定で持たせる
  // （CLAUDE.md 4-8b節：判定は常に元データのindex基準にする）
  return shuffle(picked).slice(0, TOTAL_Q).map(q => ({
    ref: q,
    order: shuffle(q.o.map((_,i)=>i)),   // order[表示位置] = 元のindex
  }));
}

/* ---------- タイマー ---------- */
function remain(){ return S.endAt - Date.now(); }
function startTimer(){
  stopTimer();
  el('timer').style.display = 'inline-block';
  tick();
  S.timerInt = setInterval(tick, 500);
}
function stopTimer(){ if(S.timerInt){ clearInterval(S.timerInt); S.timerInt = null; } }
function tick(){
  const t = el('timer');
  if(!t) return;
  t.textContent = '残り ' + fmt(remain());
  t.classList.toggle('low', remain() <= 10*60*1000);
  if(remain() <= 0){ stopTimer(); finish(true); }
}

/* ---------- 保存 ---------- */
const loadHist  = () => CloudStore.get(HIST_KEY) || [];
const saveHist  = h => CloudStore.set(HIST_KEY, h);
const loadWrong = () => CloudStore.get(WRONG_KEY) || {};
const saveWrong = w => CloudStore.set(WRONG_KEY, w);

/* ---------- 採点 ---------- */
function grade(){
  const per = {};
  FIELDS.forEach(f => { per[f.id] = {correct:0, total:0}; });
  let correct = 0;
  const wrongIds = [];
  S.qs.forEach((item, idx) => {
    const fid = fieldOf(item.ref.c);
    if(per[fid]) per[fid].total++;
    const ok = S.ans[idx] === item.ref.a;
    if(ok){ correct++; if(per[fid]) per[fid].correct++; }
    else wrongIds.push(item.ref.id);
  });
  // 本番のIRTは非公開のため、正答率をそのまま1000点満点に換算した目安を出す
  const scale = o => o.total ? Math.round(o.correct / o.total * 1000) : 0;
  const fields = FIELDS.map(f => ({
    id:f.id, name:f.name, correct:per[f.id].correct, total:per[f.id].total, score:scale(per[f.id])
  }));
  const total = Math.round(correct / S.qs.length * 1000);
  const passTotal  = total >= PASS_TOTAL;
  const passFields = fields.every(f => f.score >= PASS_FIELD);
  return { correct, answered:Object.keys(S.ans).length, count:S.qs.length,
           total, fields, pass: passTotal && passFields, passTotal, passFields, wrongIds,
           at:new Date().toISOString() };
}

/* ---------- 画面 ---------- */
function render(){
  if(S.view === 'home')   return renderHome();
  if(S.view === 'exam')   return renderExam();
  if(S.view === 'result') return renderResult();
  if(S.view === 'review') return renderReview();
}

function renderHome(){
  stopTimer();
  el('timer').style.display = 'none';
  const hist = loadHist();
  const wrong = loadWrong();
  const wrongCount = Object.keys(wrong).length;
  const pool = QQ.length + SCENARIO_Q.length;

  const histHtml = hist.length ? `
    <table class="hist">
      <tr><th>受験日</th><th>総合</th><th>ストラテジ</th><th>マネジメント</th><th>テクノロジ</th><th>判定</th></tr>
      ${hist.slice(0,10).map(h=>`<tr>
        <td>${new Date(h.at).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>
        <td><strong>${h.total}</strong></td>
        ${h.fields.map(f=>`<td style="color:${f.score>=PASS_FIELD?'var(--ok)':'var(--ng)'}">${f.score}</td>`).join('')}
        <td style="color:${h.pass?'var(--ok)':'var(--ng)'};font-weight:700">${h.pass?'合格':'不合格'}</td>
      </tr>`).join('')}
    </table>` : `<p class="note">まだ受験履歴がありません。</p>`;

  el('app').innerHTML = `
    <div class="card">
      <h1>🗾 ITパスポート 模擬試験</h1>
      <p class="sub">本番と同じ形式で通しの演習ができます。</p>
      <table class="spec">
        <tr><th>出題数</th><td>${TOTAL_Q}問（四肢択一）</td></tr>
        <tr><th>試験時間</th><td>${LIMIT_MIN}分</td></tr>
        <tr><th>分野別の配分</th><td>${FIELDS.map(f=>f.name+' '+f.n+'問').join(' ／ ')}</td></tr>
        <tr><th>合格基準</th><td>総合 <strong>${PASS_TOTAL}点</strong>以上（1000点満点）<br>
            <strong>かつ</strong> 3分野それぞれ <strong>${PASS_FIELD}点</strong>以上</td></tr>
      </table>
      <p class="note">
        問題は収録済みの <strong>${pool}問</strong>（過去問${QQ.length}問＋シナリオ${SCENARIO_Q.length}問）から、
        分野の配分に沿って毎回ランダムに選び出します。受験のたびに組み合わせが変わります。<br>
        本番の採点はIRT（項目応答理論）方式で計算式が公開されていないため、
        ここでは<strong>正答率を1000点満点に換算した目安</strong>を表示しています。
      </p>
      <div class="nav">
        <button class="btn btn-main" onclick="start()">▶ 試験を開始する</button>
        ${wrongCount ? `<button class="btn btn-sub" onclick="startWrong()">🔥 間違えた${wrongCount}問だけ解く</button>` : ''}
      </div>
    </div>
    <div class="card">
      <h2>受験履歴</h2>
      ${histHtml}
      ${hist.length ? `<div class="nav"><button class="btn btn-sub" onclick="clearHist()">履歴を消去</button></div>` : ''}
    </div>`;
}

function start(){
  S.qs = buildExam();
  S.i = 0; S.ans = {}; S.flags = {};
  S.endAt = Date.now() + LIMIT_MIN*60*1000;
  S.view = 'exam';
  startTimer();
  render();
}

function startWrong(){
  const wrong = loadWrong();
  const ids = new Set(Object.keys(wrong));
  const pool = [...QQ, ...SCENARIO_Q].filter(q => ids.has(q.id));
  if(!pool.length){ alert('復習する問題はありません。'); return; }
  S.qs = shuffle(pool).map(q => ({ ref:q, order: shuffle(q.o.map((_,i)=>i)) }));
  S.i = 0; S.ans = {}; S.flags = {};
  S.endAt = Date.now() + Math.max(10, Math.round(S.qs.length*1.2))*60*1000;
  S.view = 'exam';
  startTimer();
  render();
}

function renderExam(){
  const item = S.qs[S.i];
  const q = item.ref;
  const marks = ['ア','イ','ウ','エ'];
  const answered = Object.keys(S.ans).length;

  el('app').innerHTML = `
    <div class="card">
      <div class="qhead">
        <span class="qno">問 ${S.i+1} / ${S.qs.length}</span>
        <span class="qfield">${fieldName(fieldOf(q.c))}</span>
        <span class="sub" style="margin-left:auto">解答済み ${answered} / ${S.qs.length}</span>
      </div>
      <div class="qtext">${esc(q.q)}</div>
      ${item.order.map((orig,pos)=>`
        <button class="opt${S.ans[S.i]===orig?' sel':''}" onclick="pick(${orig})">
          <span class="mk">${marks[pos]}</span><span>${esc(q.o[orig])}</span>
        </button>`).join('')}
      <div class="nav">
        <button class="btn btn-sub" onclick="go(-1)" ${S.i===0?'disabled':''}>← 前の問題</button>
        <button class="flagbtn${S.flags[S.i]?' on':''}" onclick="toggleFlag()">
          ${S.flags[S.i]?'🚩 見直す':'⚐ 後で見直す'}</button>
        <span class="spacer"></span>
        ${S.i === S.qs.length-1
          ? `<button class="btn btn-main" onclick="confirmFinish()">採点する</button>`
          : `<button class="btn btn-main" onclick="go(1)">次の問題 →</button>`}
      </div>
    </div>
    <div class="card">
      <h2>解答状況</h2>
      <div class="grid">
        ${S.qs.map((_,n)=>`<button class="gcell${S.ans[n]!==undefined?' done':''}${S.flags[n]?' flag':''}${n===S.i?' cur':''}"
           onclick="jump(${n})">${n+1}</button>`).join('')}
      </div>
      <div class="legend">
        <span><i style="background:#E8F0FB;border-color:#9BB8DC"></i>解答済み</span>
        <span><i style="background:#FFF6D9;border-color:#B8860B"></i>見直し</span>
        <span><i style="background:#fff"></i>未解答</span>
      </div>
      <div class="nav"><button class="btn btn-sub" onclick="confirmFinish()">採点する</button></div>
    </div>`;
}

function pick(origIdx){ S.ans[S.i] = origIdx; render(); }
function go(d){ S.i = Math.min(S.qs.length-1, Math.max(0, S.i + d)); render(); }
function jump(n){ S.i = n; render(); }
function toggleFlag(){ S.flags[S.i] = !S.flags[S.i]; render(); }

function confirmFinish(){
  const un = S.qs.length - Object.keys(S.ans).length;
  const msg = un > 0
    ? `未解答が ${un} 問あります。未解答は誤答として採点されます。採点しますか？`
    : '採点しますか？';
  if(confirm(msg)) finish(false);
}

function finish(byTimeout){
  stopTimer();
  const r = grade();
  r.byTimeout = !!byTimeout;
  S.result = r;

  // 誤答プールの更新（正解した問題は取り除く）
  const wrong = loadWrong();
  S.qs.forEach((item, idx) => {
    if(S.ans[idx] === item.ref.a) delete wrong[item.ref.id];
    else wrong[item.ref.id] = (wrong[item.ref.id] || 0) + 1;
  });
  saveWrong(wrong);

  const hist = loadHist();
  hist.unshift({ at:r.at, total:r.total, fields:r.fields, pass:r.pass, correct:r.correct, count:r.count });
  saveHist(hist.slice(0, 50));

  S.view = 'result';
  render();
}

function renderResult(){
  el('timer').style.display = 'none';
  const r = S.result;
  const reason = r.pass ? ''
    : !r.passTotal && !r.passFields ? '総合点と分野別基準の両方に届いていません。'
    : !r.passTotal ? '分野別の基準は満たしていますが、総合点が届いていません。'
    : '総合点は基準を超えていますが、300点未満の分野があります。<strong>ITパスポートは1分野でも基準を下回ると不合格です。</strong>';

  el('app').innerHTML = `
    <div class="card" style="text-align:center">
      ${r.byTimeout ? `<p class="sub" style="color:var(--ng)">⏰ 制限時間に達したため自動採点しました</p>` : ''}
      <div class="big">${r.total}<small> / 1000</small></div>
      <div class="verdict ${r.pass?'pass':'fail'}">${r.pass?'合格ライン到達':'不合格'}</div>
      <p class="sub">${r.correct} / ${r.count} 問正解（解答 ${r.answered} 問）</p>
      ${reason ? `<p class="note" style="margin-top:8px">${reason}</p>` : ''}
    </div>
    <div class="card">
      <h2>分野別の結果</h2>
      <p class="note" style="margin-bottom:12px">3分野すべてで ${PASS_FIELD} 点以上が必要です。</p>
      ${r.fields.map(f=>`
        <div class="frow">
          <div class="t"><span>${f.name}<span class="sub">（${f.correct}/${f.total}問）</span></span>
            <strong style="color:${f.score>=PASS_FIELD?'var(--ok)':'var(--ng)'}">${f.score} 点</strong></div>
          <div class="fbar"><i style="width:${Math.min(100,f.score/10)}%;background:${f.score>=PASS_FIELD?'var(--ok)':'var(--ng)'}"></i></div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="nav">
        <button class="btn btn-main" onclick="S.reviewIdx=0;S.view='review';render()">解答を確認する</button>
        <button class="btn btn-sub" onclick="start()">もう一度受験する</button>
        <button class="btn btn-sub" onclick="S.view='home';render()">トップへ戻る</button>
      </div>
    </div>`;
}

function renderReview(){
  const wrongIdx = S.qs.map((item,i)=>({item,i})).filter(x => S.ans[x.i] !== x.item.ref.a).map(x=>x.i);
  const list = wrongIdx.length ? wrongIdx : S.qs.map((_,i)=>i);
  const idx = list[Math.min(S.reviewIdx, list.length-1)];
  const item = S.qs[idx];
  const q = item.ref;
  const marks = ['ア','イ','ウ','エ'];
  const mine = S.ans[idx];

  el('app').innerHTML = `
    <div class="card">
      <div class="qhead">
        <span class="qno">問 ${idx+1}</span>
        <span class="qfield">${fieldName(fieldOf(q.c))}</span>
        <span class="sub" style="margin-left:auto">
          ${wrongIdx.length ? `間違えた問題 ${S.reviewIdx+1} / ${list.length}` : `全問正解のため全 ${list.length} 問を表示`}</span>
      </div>
      <div class="qtext">${esc(q.q)}</div>
      ${item.order.map((orig,pos)=>{
        let cls = '';
        if(orig === q.a) cls = ' correct';
        else if(orig === mine) cls = ' wrong';
        return `<div class="opt${cls}" style="cursor:default">
          <span class="mk">${marks[pos]}</span><span>${esc(q.o[orig])}
          ${orig===q.a?' <strong style="color:var(--ok)">← 正解</strong>':''}
          ${orig===mine&&orig!==q.a?' <strong style="color:var(--ng)">← あなたの解答</strong>':''}</span></div>`;
      }).join('')}
      ${mine === undefined ? `<p class="note" style="color:var(--ng)">この問題は未解答でした。</p>` : ''}
      <div class="expl">${esc(q.e)}</div>
      <div class="nav">
        <button class="btn btn-sub" onclick="S.reviewIdx=Math.max(0,S.reviewIdx-1);render()" ${S.reviewIdx===0?'disabled':''}>← 前</button>
        <span class="spacer"></span>
        ${S.reviewIdx < list.length-1
          ? `<button class="btn btn-main" onclick="S.reviewIdx++;render()">次 →</button>`
          : `<button class="btn btn-main" onclick="S.view='result';render()">結果に戻る</button>`}
      </div>
    </div>`;
}

function clearHist(){
  if(!confirm('受験履歴を消去しますか？（間違えた問題の記録は残ります）')) return;
  saveHist([]);
  render();
}

/* ---------- 起動 ---------- */
CloudStore.init([HIST_KEY, WRONG_KEY]).then(()=>{
  render();
  CloudStore.onChange(()=>{ if(S.view === 'home') render(); });
}).catch(e=>{
  el('app').innerHTML = `<div class="card"><h1>接続できませんでした</h1>
    <p class="note">${esc(e.message)}<br>ページを再読み込みしてください。</p></div>`;
});

window.addEventListener('beforeunload', e => {
  if(S.view === 'exam'){ e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
